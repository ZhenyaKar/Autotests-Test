name: Run Autotests and Allure Report - Test!!!

on:
 # Автозапуск при отправке кода
  # push:
  #   branches: [ main, master ]

  # Запуск по расписанию
  # schedule:
  #   - cron: '0 6 * * *' # Каждый день в 09:00 по Москве (06:00 UTC)
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Что запустить? (путь к папке, файлу или несколько путей через пробел)'
        required: true
        default: 'Tests'
        type: string

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запускаем pytest и собираем данные для Allure
        run: |
          ARGS="${{ inputs.pytest_args }}"
          CLEAN_ARGS="${ARGS//,/ }"
          pytest $CLEAN_ARGS --alluredir=allure-results
        continue-on-error: true

      - name: Запускаем pytest и собираем данные для Allure
        run: pytest ${{ inputs.pytest_args }} --alluredir=allure-results
        continue-on-error: true

      - name: Генерируем отчет Allure с историей запусков
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Публикуем отчет на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
